name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke exact artifacts without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: 29
          elixir-version: "1.20"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: mix deps.get
      - run: pnpm install --frozen-lockfile
      - name: Build exact registry artifacts
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/release.mjs build --tag "$GITHUB_REF_NAME" --artifact-dir dist/release
          else
            node scripts/release.mjs build --allow-untagged --artifact-dir dist/release
          fi
      - name: Install and execute exact packed artifacts
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/release.mjs smoke --tag "$GITHUB_REF_NAME" --artifact-dir dist/release
          else
            node scripts/release.mjs smoke --allow-untagged --artifact-dir dist/release
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: dist/release

  publish:
    if: github.ref_type == 'tag' && inputs.dry_run != true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: 29
          elixir-version: "1.20"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ github.sha }}
          path: dist/release
      - run: node scripts/release.mjs verify --tag "$GITHUB_REF_NAME" --artifact-dir dist/release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/release/*.tar
            dist/release/*.tgz
            dist/release/release-manifest.json
            dist/release/SHA256SUMS
      - name: Publish exact verified bytes or resume an identical partial release
        run: node scripts/release.mjs publish --tag "$GITHUB_REF_NAME" --artifact-dir dist/release
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish HexDocs from tagged source
        run: mix deps.get && mix hex.publish docs --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      - name: Create immutable GitHub release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
